    <rect x="262" y="644" width="500" height="108" rx="20" fill="#0F172A"/>
    <text x="292" y="685" class="mono code blue">const</text>
    <text x="376" y="685" class="mono code" fill="#E2E8F0">summary</text>
    <text x="486" y="685" class="mono code" fill="#CBD5E1">=</text>
    <text x="522" y="685" class="mono code gold">buildPortfolio()</text>
    <text x="292" y="722" class="mono code cyan">console.log</text>
